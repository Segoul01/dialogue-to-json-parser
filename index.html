<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>JSON Parser</title>
</head>
<body>
    <div class="main-wrapper">
        <div class="input-wrapper">
            <h2>Enter Dialogue Here: </h2>
            <textarea id="inputDialogue" name="inputDialogue" rows="15" cols="120"></textarea>
            <button id="convertButton" name="convertButton">Convert to JSON</button>
        </div>
        <div class="output-wrapper">
            <h2>Output: </h2>
            <div class="output-btns">
                <button id="copyButton" name="copyButton">Copy</button>
                <button id="downloadButton" name="downloadButton">Download JSON Files</button>
            </div>
            <textarea id="output" rows="15" cols="120" readonly></textarea>
        </div>
    </div>
</body>
</html>
